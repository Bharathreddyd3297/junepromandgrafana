# Demo workload for the Prometheus + Grafana lab.
#
#   podinfo        - small Go web app that exposes Prometheus metrics on /metrics
#   stress sidecar - runs inside every podinfo pod; used to inject CPU / memory load
#   loadgen-*      - HTTP traffic generators, created with 0 replicas.
#                    Scale them up to inject traffic, back to 0 to stop.
#   ServiceMonitor - tells Prometheus to scrape podinfo
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stress-scripts
  namespace: demo
data:
  cpu.py: |
    """Burn CPU.  Usage: python cpu.py [seconds=180] [workers=1]"""
    import multiprocessing
    import sys
    import time


    def burn(end):
        while time.time() < end:
            pass


    if __name__ == "__main__":
        secs = int(sys.argv[1]) if len(sys.argv) > 1 else 180
        workers = int(sys.argv[2]) if len(sys.argv) > 2 else 1
        end = time.time() + secs
        print(f"Burning CPU with {workers} worker(s) for {secs}s ...", flush=True)
        procs = [multiprocessing.Process(target=burn, args=(end,)) for _ in range(workers)]
        for p in procs:
            p.start()
        for p in procs:
            p.join()
        print("CPU load finished.", flush=True)
  mem.py: |
    """Allocate memory and hold it.  Usage: python mem.py [MiB=200] [seconds=180]"""
    import sys
    import time

    mb = int(sys.argv[1]) if len(sys.argv) > 1 else 200
    secs = int(sys.argv[2]) if len(sys.argv) > 2 else 180
    print(f"Allocating {mb} MiB and holding it for {secs}s ...", flush=True)
    blocks = []
    for i in range(mb):
        # Non-zero bytes so every page is really touched (counts as used memory).
        blocks.append(bytearray(b"x") * (1024 * 1024))
        if (i + 1) % 50 == 0:
            print(f"  {i + 1} MiB allocated", flush=True)
    print("Holding memory ...", flush=True)
    time.sleep(secs)
    print("Memory released.", flush=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: stress
          image: python:3.12-alpine
          workingDir: /scripts
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: stress-scripts
              mountPath: /scripts
      volumes:
        - name: stress-scripts
          configMap:
            name: stress-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
  labels:
    app: podinfo
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  namespace: demo
  labels:
    app: podinfo
    release: monitoring
spec:
  selector:
    matchLabels:
      app: podinfo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# Normal traffic: ~20 requests/second per replica, all HTTP 200.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-ok
  namespace: demo
  labels:
    app: loadgen
spec:
  replicas: 0
  selector:
    matchLabels:
      app: loadgen
      scenario: ok
  template:
    metadata:
      labels:
        app: loadgen
        scenario: ok
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: loadgen
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://podinfo:9898/
                sleep 0.05
              done
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
# Failing traffic: every request returns HTTP 500.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-errors
  namespace: demo
  labels:
    app: loadgen
spec:
  replicas: 0
  selector:
    matchLabels:
      app: loadgen
      scenario: errors
  template:
    metadata:
      labels:
        app: loadgen
        scenario: errors
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: loadgen
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://podinfo:9898/status/500
                sleep 0.1
              done
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
# Slow traffic: 5 parallel clients, each request takes 1 second.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-slow
  namespace: demo
  labels:
    app: loadgen
spec:
  replicas: 0
  selector:
    matchLabels:
      app: loadgen
      scenario: slow
  template:
    metadata:
      labels:
        app: loadgen
        scenario: slow
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: loadgen
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in 1 2 3 4 5; do
                (while true; do wget -q -O /dev/null http://podinfo:9898/delay/1; done) &
              done
              wait
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
